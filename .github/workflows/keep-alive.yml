name: Keep Streamlit Alive

on:
  schedule:
    # Staggered 3–5 h intervals with irregular minutes to look organic
    - cron: '12 1 * * *'   # 01:12 UTC
    - cron: '47 4 * * *'   # 04:47 UTC  (+3 h 35 m)
    - cron: '3 8 * * *'    # 08:03 UTC  (+3 h 16 m)
    - cron: '38 12 * * *'  # 12:38 UTC  (+4 h 35 m)
    - cron: '9 16 * * *'   # 16:09 UTC  (+3 h 31 m)
    - cron: '51 20 * * *'  # 20:51 UTC  (+4 h 42 m)
  workflow_dispatch:        # Manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Random jitter (0–5 min)
        run: sleep $((RANDOM % 300))

      - name: Ping Streamlit app
        run: |
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                   -L --max-time 60 \
                   "https://property-vs-portfolio.streamlit.app/")
            echo "Attempt $i — HTTP $CODE"
            if [ "$CODE" = "200" ] || [ "$CODE" = "302" ]; then
              echo "App is alive"
              exit 0
            fi
            sleep 20
          done
          echo "App did not respond after 3 attempts"
          exit 1

  keepalive-commit:
    runs-on: ubuntu-latest
    # Only run once a week (Sunday at ~20:51 UTC) to keep repo "active"
    if: github.event.schedule == '51 20 * * *'
    steps:
      - uses: actions/checkout@v4

      - name: Bump keepalive timestamp
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .last_alive

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_alive
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: keepalive $(cat .last_alive)"
          git push
